<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Digital</title>


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #9c428a;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            background: #2b2528;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(54, 8, 221, 0.4);
        }

        h1 {
            margin-bottom: 10px;
        }

        #scanText {
            color: #e8ebf0;
            margin-bottom: 30px;
        }

        #fingerprintBox {
            width: 150px;
            height: 150px;
            margin: auto;
            border: 3px solid #131212;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }

        #fingerprintBox span {
            font-size: 70px;
        }

        #fingerprintBox.scanning {
            border-color: #22c55e;
            box-shadow: 0 0 30px #22c55e;
            transform: scale(1.15);
        }

        #fingerprintBox.success {
            border-color: #3b82f6;
            box-shadow: 0 0 30px #3b82f6;
            background-color: rgb(223, 27, 196);

            
            
        }

        .instruction {
            margin-top: 25px;
            color: #c9c9c9;
            font-size: 14px;
        }

        .heart {
        position: fixed;
        font-size: 30px;
        pointer-events: none;
        animation: heartPop 1.5s ease-out forwards;
        z-index: 9999;
        }

    @keyframes heartPop {
        0% {
            transform: scale(0);
            opacity: 1;
        }

        50% {
            transform: scale(1.5);
            opacity: 1;
        }

        100% {
            transform: translateY(-200px) scale(1);
            opacity: 0;
        }
}
    </style>
</head>

<body>

    <div class="container">

        <h1>Leitor de Digital</h1>

        <p id="scanText">
            Pressione e segure a digital
        </p>

        <div id="fingerprintBox">
            <span id="mudar">☝️</span>
        </div>

        <p class="instruction">
            Mantenha pressionado por 2 segundos
        </p>

        <script src="Script.js" type="module">
            
        </script>
    </div>


</body>
</html>
